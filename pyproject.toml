[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-duration-momentum"
version = "0.1.0"
description = "Causal intraday CAD duration research, with empty market-data inputs"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "xgboost>=2.0", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]
